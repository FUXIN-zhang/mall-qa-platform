name: Full-Stack QA Regression CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  api-and-ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium and system dependencies
        run: playwright install --with-deps chromium

      - name: Run Pytest API & Web UI Regression Suite
        env:
          MALL_SERVER_IP: ${{ secrets.MALL_SERVER_IP }}
          MALL_MYSQL_PWD: ${{ secrets.MALL_MYSQL_PWD }}
          MALL_LOGIN_NAME: ${{ secrets.MALL_LOGIN_NAME }}
          MALL_LOGIN_PWD: ${{ secrets.MALL_LOGIN_PWD }}
        run: |
          mkdir -p reports
          pytest

      - name: Upload HTML Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-regression-report
          path: reports/report.html
          retention-days: 14